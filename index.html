<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Перевёртыш</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel для работы JSX прямо в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .perspective { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const tg = window.Telegram?.WebApp;

    function App() {
      const [isPro, setIsPro] = useState(false);
      const [decks, setDecks] = useState([]);
      const [activeDeckId, setActiveDeckId] = useState(null);
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const [isProModalOpen, setIsProModalOpen] = useState(false);
      const [isDeckModalOpen, setIsDeckModalOpen] = useState(false);
      const [isCardModalOpen, setIsCardModalOpen] = useState(false);

      const [deckTitle, setDeckTitle] = useState("");
      const [frontText, setFrontText] = useState("");
      const [backText, setBackText] = useState("");

      const touchStartX = useRef(0);
      const touchEndX = useRef(0);

      useEffect(() => {
        if (tg) {
          tg.ready();
          tg.expand();
        }
        const savedDecks = localStorage.getItem("pv_decks");
        const savedPro = localStorage.getItem("pv_pro");
        if (savedPro === "true") setIsPro(true);

        if (savedDecks) {
          const parsed = JSON.parse(savedDecks);
          setDecks(parsed);
          if (parsed.length > 0) setActiveDeckId(parsed[0].id);
        } else {
          const initial = [{
            id: "d1",
            title: "Базовые слова",
            cards: [
              { id: "c1", front: "Привет", back: "Hello" },
              { id: "c2", front: "Спасибо", back: "Thank you" },
              { id: "c3", front: "Как дела?", back: "How are you?" }
            ]
          }];
          setDecks(initial);
          setActiveDeckId("d1");
        }
      }, []);

      useEffect(() => {
        if (decks.length > 0) localStorage.setItem("pv_decks", JSON.stringify(decks));
      }, [decks]);

      const activeDeck = decks.find(d => d.id === activeDeckId) || decks[0];
      const currentCard = activeDeck?.cards?.[cardIndex];

      const haptic = (type = "light") => {
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(type);
      };

      const flipCard = () => {
        haptic("medium");
        setIsFlipped(!isFlipped);
      };

      const nextCard = () => {
        if (!activeDeck || activeDeck.cards.length <= 1) return;
        haptic("light");
        setIsFlipped(false);
        setCardIndex((prev) => (prev + 1) % activeDeck.cards.length);
      };

      const prevCard = () => {
        if (!activeDeck || activeDeck.cards.length <= 1) return;
        haptic("light");
        setIsFlipped(false);
        setCardIndex((prev) => (prev - 1 + activeDeck.cards.length) % activeDeck.cards.length);
      };

      const handleAddDeck = () => {
        if (!isPro && decks.length >= 1) {
          setIsProModalOpen(true);
          return;
        }
        setDeckTitle("");
        setIsDeckModalOpen(true);
      };

      const saveDeck = () => {
        if (!deckTitle.trim()) return;
        const newD = { id: "d_" + Date.now(), title: deckTitle.trim(), cards: [] };
        setDecks([...decks, newD]);
        setActiveDeckId(newD.id);
        setCardIndex(0);
        setIsDeckModalOpen(false);
      };

      const saveCard = () => {
        if (!frontText.trim() || !backText.trim() || !activeDeck) return;
        if (activeDeck.cards.length >= 30) {
          alert("Лимит 30 карточек в блоке исчерпан!");
          return;
        }
        const updatedCards = [...activeDeck.cards, { id: "c_" + Date.now(), front: frontText.trim(), back: backText.trim() }];
        setDecks(decks.map(d => d.id === activeDeck.id ? { ...d, cards: updatedCards } : d));
        setCardIndex(updatedCards.length - 1);
        setIsCardModalOpen(false);
        setFrontText("");
        setBackText("");
      };

      const speak = (e, text) => {
        e.stopPropagation();
        if ("speechSynthesis" in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US";
          window.speechSynthesis.speak(u);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">
          {/* Шапка */}
          <header className="flex justify-between items-center bg-teal-950/80 p-3 rounded-2xl border border-teal-800/40">
            <div>
              <h1 className="font-bold text-white text-base">Перевёртыш</h1>
              <span className="text-[10px] text-teal-300">
                {isPro ? "★ PRO РЕЖИМ" : "FREE (1 блок)"}
              </span>
            </div>
            {!isPro && (
              <button 
                onClick={() => setIsProModalOpen(true)}
                className="bg-amber-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-xl shadow active:scale-95">
                Купить PRO
              </button>
            )}
          </header>

          {/* Список колод */}
          <div className="flex gap-2 overflow-x-auto py-2 no-scrollbar">
            {decks.map(d => (
              <button
                key={d.id}
                onClick={() => { setActiveDeckId(d.id); setCardIndex(0); setIsFlipped(false); }}
                className={`px-3 py-1.5 rounded-xl text-xs whitespace-nowrap ${
                  d.id === activeDeckId ? "bg-teal-500 text-slate-950 font-bold" : "bg-slate-900 border border-slate-800 text-slate-300"
                }`}>
                {d.title} ({d.cards.length}/30)
              </button>
            ))}
            <button 
              onClick={handleAddDeck}
              className="px-3 py-1.5 rounded-xl text-xs bg-teal-950/60 border border-dashed border-teal-600 text-teal-300 whitespace-nowrap">
              + Новый блок {!isPro && "(PRO)"}
            </button>
          </div>

          {/* Карточка */}
          <main className="flex-1 flex flex-col justify-center items-center my-4">
            {activeDeck && activeDeck.cards.length > 0 ? (
              <div className="w-full">
                <div className="text-xs text-slate-400 text-center mb-2">
                  Карточка {cardIndex + 1} из {activeDeck.cards.length}
                </div>
                <div 
                  className="w-full h-80 perspective cursor-pointer"
                  onClick={flipCard}
                  onTouchStart={e => { touchStartX.current = e.targetTouches[0].clientX; }}
                  onTouchEnd={e => {
                    touchEndX.current = e.changedTouches[0].clientX;
                    const diff = touchStartX.current - touchEndX.current;
                    if (Math.abs(diff) > 40) {
                      if (diff > 0) nextCard();
                      else prevCard();
                    }
                  }}>
                  <div className={`relative w-full h-full duration-500 preserve-3d transition-transform ${isFlipped ? "rotate-y-180" : ""}`}>
                    {/* Лицевая сторона (Русский - Белая) */}
                    <div className="absolute inset-0 backface-hidden rounded-3xl bg-white text-slate-900 shadow-2xl p-6 flex flex-col justify-between border-4 border-slate-100">
                      <div className="text-xs text-slate-400 font-bold uppercase">Родной язык</div>
                      <div className="text-center font-bold text-2xl">{currentCard.front}</div>
                      <div className="text-xs text-slate-400 text-center">Тапните для переворота • Свайп влево/вправо</div>
                    </div>

                    {/* Оборот (Английский - Фиолетовая) */}
                    <div className="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br from-indigo-700 via-purple-700 to-indigo-950 text-white shadow-2xl p-6 flex flex-col justify-between border-2 border-purple-400/30">
                      <div className="flex justify-between items-center text-xs text-purple-200 uppercase font-bold">
                        <span>Английский</span>
                        <button onClick={(e) => speak(e, currentCard.back)} className="p-1.5 bg-purple-600/40 border border-purple-400 rounded-lg">🔊</button>
                      </div>
                      <div className="text-center font-bold text-2xl">{currentCard.back}</div>
                      <div className="text-xs text-purple-300 text-center">Тапните, чтобы вернуть</div>
                    </div>
                  </div>
                </div>

                <div className="flex justify-between mt-6 px-4">
                  <button onClick={prevCard} className="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-sm">◀ Назад</button>
                  <button onClick={flipCard} className="px-4 py-3 bg-teal-500/10 border border-teal-500/30 text-teal-300 rounded-2xl text-xs font-bold">🔄 Перевернуть</button>
                  <button onClick={nextCard} className="p-3 bg-slate-900 rounded-2xl border border-slate-800 text-sm">Вперед ▶</button>
                </div>
              </div>
            ) : (
              <div className="text-center text-slate-400 text-sm">В блоке нет карточек</div>
            )}
          </main>

          {/* Кнопка добавления карточки */}
          <button 
            onClick={() => setIsCardModalOpen(true)}
            className="w-full bg-teal-500 text-slate-950 font-bold py-3 rounded-2xl text-sm shadow active:scale-95 mb-2">
            + Добавить карточку ({activeDeck ? activeDeck.cards.length : 0}/30)
          </button>

          {/* Модалка PRO */}
          {isProModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl w-full max-w-sm space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">Подписка PRO</h3>
                  <button onClick={() => setIsProModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-300">Открывает создание бесконечного количества блоков по 30 карточек.</p>
                <div className="bg-slate-950 p-4 rounded-2xl text-center border border-amber-500/20">
                  <div className="text-xl font-bold text-amber-400 mb-1">150 ★ Stars / 1.5 TON</div>
                  <p className="text-[11px] text-slate-400 mb-3">Оплата в Telegram</p>
                  <button 
                    onClick={() => { setIsPro(true); localStorage.setItem("pv_pro", "true"); setIsProModalOpen(false); }}
                    className="w-full bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs">
                    Активировать PRO
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Модалка создания блока */}
          {isDeckModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl w-full max-w-sm space-y-3">
                <h3 className="font-bold text-white text-sm">Название нового блока</h3>
                <input 
                  type="text" 
                  value={deckTitle}
                  onChange={e => setDeckTitle(e.target.value)}
                  placeholder="Например, Еда и Ресторан"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" 
                />
                <div className="flex gap-2">
                  <button onClick={() => setIsDeckModalOpen(false)} className="flex-1 py-2 bg-slate-800 rounded-xl text-xs">Отмена</button>
                  <button onClick={saveDeck} className="flex-1 py-2 bg-teal-500 text-slate-950 font-bold rounded-xl text-xs">Создать</button>
                </div>
              </div>
            </div>
          )}

          {/* Модалка создания карточки */}
          {isCardModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl w-full max-w-sm space-y-3">
                <h3 className="font-bold text-white text-sm">Новая карточка</h3>
                <input 
                  type="text" 
                  value={frontText}
                  onChange={e => setFrontText(e.target.value)}
                  placeholder="Слово на русском"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" 
                />
                <input 
                  type="text" 
                  value={backText}
                  onChange={e => setBackText(e.target.value)}
                  placeholder="Перевод на английский"
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white" 
                />
                <div className="flex gap-2">
                  <button onClick={() => setIsCardModalOpen(false)} className="flex-1 py-2 bg-slate-800 rounded-xl text-xs">Отмена</button>
                  <button onClick={saveCard} className="flex-1 py-2 bg-teal-500 text-slate-950 font-bold rounded-xl text-xs">Сохранить</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
